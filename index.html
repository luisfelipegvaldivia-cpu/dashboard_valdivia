<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Dashboard Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A; --surface:#1E293B; --surface-hover:#243347; --ink:#F8FAFC; 
  --muted:#94A3B8; --line:#334155; --accent:#6366F1; --accent-ink:#FFFFFF; 
  --signal:#10B981;
  --head:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 0.95rem/1.5 var(--body);padding-bottom:2rem}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho */
header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;
  padding:1.5rem clamp(1rem,4vw,2.5rem);background:var(--surface);border-bottom:1px solid var(--line)}
.boas-vindas h1{font:700 1.6rem/1.2 var(--head);margin:0;letter-spacing:-.02em}
.boas-vindas p{color:var(--muted);margin:.2rem 0 0;font-size:.9rem}

/* Widgets no topo */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;
  padding:1.5rem clamp(1rem,4vw,2.5rem);max-width:1400px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem}
.card h2{font:600 1.1rem var(--head);margin:0 0 .8rem;display:flex;align-items:center;justify-content:space-between}

/* Clima */
.clima-info{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem}
.clima-temp{font-size:2rem;font-weight:700;color:var(--accent)}
.clima-detalhes{text-align:right;color:var(--muted);font-size:.85rem}

/* Tarefas */
.todo-form{display:flex;gap:.5rem;margin-bottom:.8rem}
.todo-form input{flex:1;padding:.5rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.todo-form button{background:var(--accent);color:var(--accent-ink);border:none;padding:.5rem 1rem;border-radius:6px;font-weight:600;cursor:pointer}
.todo-list{list-style:none;padding:0;margin:0;max-height:160px;overflow-y:auto}
.todo-item{display:flex;align-items:center;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--line)}
.todo-item:last-child{border:none}
.todo-item.done span{text-decoration:line-through;color:var(--muted)}
.todo-item button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem}

/* Jogos e Transporte */
.info-box{background:var(--bg);border-radius:8px;padding:.75rem;margin-bottom:.6rem;font-size:.85rem;display:flex;flex-direction:column;gap:.3rem}
.info-title{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.info-desc{color:var(--muted);font-size:.8rem;line-height:1.3}

/* Feed de Notícias */
.feed-section{padding:0 clamp(1rem,4vw,2.5rem);max-width:1400px;margin:0 auto}
.feed-header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
#busca{padding:.5rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;width:min(100%,20rem)}
.feed-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media(max-width:860px){.feed-grid{grid-template-columns:1fr}}

.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem}
.chips button{font:500 .8rem var(--body);padding:.3rem .6rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

ul.feed-list{list-style:none;padding:0;margin:0}
ul.feed-list li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.75rem 1rem;margin-bottom:.5rem}
ul.feed-list li a{font-weight:600;font-size:.95rem;text-decoration:none}
ul.feed-list li a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:.25rem .75rem;margin-top:.25rem;color:var(--muted);font-size:.8rem}
.novo{display:inline-flex;align-items:center;gap:.3rem;color:var(--ink);font-weight:600}
.novo::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--signal)}
.vazio{color:var(--muted);padding:.8rem;border:1px dashed var(--line);border-radius:8px;font-size:.85rem}
</style>
</head>
